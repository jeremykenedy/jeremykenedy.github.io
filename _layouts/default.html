<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title }}</title>
<meta name="description" content="Director of Engineering in Portland, Oregon. Open source projects and profile, mirrored from github.com/jeremykenedy.">
<link rel="canonical" href="https://github.com/jeremykenedy">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.5.1/github-markdown.min.css">
<style>
  body { margin: 0; background: #ffffff; }
  .markdown-body { box-sizing: border-box; max-width: 1012px; margin: 0 auto; padding: 32px 16px; }
  .site-links { max-width: 1012px; margin: 0 auto; padding: 16px 16px 0; font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .site-links a { color: #0969da; text-decoration: none; margin-right: 16px; }
  [href$="#gh-dark-mode-only"], [src$="#gh-dark-mode-only"] { display: none; }
  @media (prefers-color-scheme: dark) {
    body { background: #0d1117; }
    .site-links a { color: #4493f8; }
    [href$="#gh-dark-mode-only"], [src$="#gh-dark-mode-only"] { display: inline; }
    [href$="#gh-light-mode-only"], [src$="#gh-light-mode-only"] { display: none; }
  }
</style>
</head>
<body>
<nav class="site-links"><a href="https://github.com/jeremykenedy">GitHub</a><a href="https://jeremykenedy.com">jeremykenedy.com</a><a href="https://www.linkedin.com/in/jeremykenedy">LinkedIn</a></nav>
<article class="markdown-body">
{{ content }}
</article>
</body>
</html>
